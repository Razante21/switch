<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Inscrições · FIEC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1a26;
    --surface: #1e3a52;
    --surface2: #162a3d;
    --accent: #f5a623;
    --green: #3dba7e;
    --red: #e05c5c;
    --text: #ffffff;
    --text-sub: #8fb3cc;
    --divider: rgba(255,255,255,.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .logo {
    display: inline-block;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: .1em;
    padding: 3px 14px;
    border-radius: 4px;
    align-self: flex-start;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    text-transform: uppercase;
    line-height: 1;
  }

  h1 span { color: var(--accent); }

  /* STATUS */
  .status-box {
    background: var(--surface2);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--divider);
  }

  .status-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-sub);
  }
  .status-dot.aberto { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.fechado { background: var(--red); box-shadow: 0 0 8px var(--red); }

  .status-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .status-sub {
    font-size: .75rem;
    color: var(--text-sub);
    margin-top: 2px;
  }

  /* FORM */
  .field { display: flex; flex-direction: column; gap: 6px; }

  label {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--text-sub);
    font-weight: 600;
  }

  input[type="password"] {
    background: var(--bg);
    border: 1px solid var(--divider);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s;
  }

  input[type="password"]:focus { border-color: var(--accent); }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button {
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
  }

  button:hover { opacity: .88; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .btn-abrir { background: var(--green); color: var(--bg); }
  .btn-fechar { background: var(--red); color: #fff; }

  .msg {
    font-size: .82rem;
    padding: 10px 14px;
    border-radius: 7px;
    text-align: center;
    display: none;
  }
  .msg.ok { background: rgba(61,186,126,.15); color: var(--green); border: 1px solid rgba(61,186,126,.3); }
  .msg.err { background: rgba(224,92,92,.15); color: var(--red); border: 1px solid rgba(224,92,92,.3); }
</style>
</head>
<body>

<div class="card">
  <div>
    <div class="logo">FIEC</div>
  </div>
  <h1>Painel de <span>Inscrições</span></h1>

  <div class="status-box">
    <div class="status-dot" id="statusDot"></div>
    <div>
      <div class="status-label" id="statusLabel">Verificando...</div>
      <div class="status-sub">Status atual das inscrições em todos os polos</div>
    </div>
  </div>

  <div class="field">
    <label>Senha do painel</label>
    <input type="password" id="senha" placeholder="••••••••">
  </div>

  <div class="btns">
    <button class="btn-abrir" onclick="atualizar('ABERTO')">✓ Abrir</button>
    <button class="btn-fechar" onclick="atualizar('FECHADO')">✕ Fechar</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  async function carregarStatus() {
    try {
      const r = await fetch('/api/switch');
      const d = await r.json();
      const dot = document.getElementById('statusDot');
      const label = document.getElementById('statusLabel');
      if (d.aberto) {
        dot.className = 'status-dot aberto';
        label.textContent = 'Inscrições abertas';
      } else {
        dot.className = 'status-dot fechado';
        label.textContent = 'Inscrições fechadas';
      }
    } catch(e) {
      document.getElementById('statusLabel').textContent = 'Erro ao verificar';
    }
  }

  async function atualizar(status) {
    const senha = document.getElementById('senha').value;
    const msg = document.getElementById('msg');

    if (!senha) {
      msg.textContent = 'Digite a senha primeiro!';
      msg.className = 'msg err';
      msg.style.display = 'block';
      return;
    }

    try {
      const r = await fetch('/api/switch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha, status })
      });
      const d = await r.json();

      if (d.success) {
        msg.textContent = status === 'ABERTO'
          ? '✓ Inscrições abertas em todos os polos!'
          : '✕ Inscrições fechadas em todos os polos!';
        msg.className = 'msg ok';
        carregarStatus();
      } else {
        msg.textContent = d.error || 'Erro desconhecido';
        msg.className = 'msg err';
      }
    } catch(e) {
      msg.textContent = 'Erro de conexão';
      msg.className = 'msg err';
    }

    msg.style.display = 'block';
  }

  carregarStatus();
</script>
</body>
</html>
