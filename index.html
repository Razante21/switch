<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · FIEC Inscrições</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #050a11;
    --surface: #0c1825;
    --s2:      #102233;
    --s3:      #162840;
    --accent:  #c8882a;
    --accent2: #f3c674;
    --blue:    #6cc0e8;
    --green:   #4cd9a5;
    --red:     #ec6a6a;
    --text:    #eef2f7;
    --sub:     #7892a8;
    --dim:     #314c63;
    --line:    rgba(255,255,255,.07);
    --gold:    rgba(200,136,42,.2);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  /* ── TELA DE LOGIN ── */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 44px 40px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: .3em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .login-card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.1;
  }
  .login-card h1 span { color: var(--accent); font-style: italic; }

  /* ── CAMPOS ── */
  .field { display: flex; flex-direction: column; gap: 7px; }

  label {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--sub);
  }

  input[type="password"], input[type="text"], select, textarea {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: .95rem;
    outline: none;
    width: 100%;
    transition: border-color .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; font-size: .88rem; }

  /* ── BOTÕES ── */
  .btn {
    padding: 12px 22px;
    border-radius: 9px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: .88rem;
    letter-spacing: .06em;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
    text-transform: uppercase;
  }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-accent  { background: var(--accent); color: var(--bg); }
  .btn-green   { background: var(--green); color: #04110d; }
  .btn-red     { background: var(--red); color: #fff; }
  .btn-blue    { background: var(--blue); color: var(--bg); }
  .btn-ghost   { background: transparent; border: 1px solid var(--line); color: var(--sub); }
  .btn-sm      { padding: 7px 14px; font-size: .78rem; }
  .btn-full    { width: 100%; }

  /* ── MENSAGEM ── */
  .msg {
    padding: 10px 16px;
    border-radius: 8px;
    font-size: .85rem;
    display: none;
  }
  .msg.ok  { background: rgba(76,217,165,.1); color: var(--green); border: 1px solid rgba(76,217,165,.2); }
  .msg.err { background: rgba(236,106,106,.1); color: var(--red);   border: 1px solid rgba(236,106,106,.2); }

  /* ── LAYOUT ADMIN ── */
  #adminPanel { display: none; max-width: 960px; margin: 0 auto; }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    flex-wrap: gap;
    gap: 12px;
  }

  .admin-header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 900;
  }
  .admin-header-left h1 span { color: var(--accent); font-style: italic; }
  .admin-header-left p { font-size: .85rem; color: var(--sub); margin-top: 4px; }

  /* ── SWITCH CARD ── */
  .switch-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 28px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .switch-status {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .status-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .status-dot.aberto  { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status-dot.fechado { background: var(--red);   box-shadow: 0 0 10px var(--red); }

  .status-info h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
  }
  .status-info p { font-size: .82rem; color: var(--sub); margin-top: 2px; }

  .switch-btns { display: flex; gap: 10px; }

  /* ── TURMAS ── */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title span { color: var(--accent); font-style: italic; }

  .polos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .polo-admin-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }

  .polo-admin-header {
    background: var(--s2);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }

  .polo-admin-header h4 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
  }

  .polo-admin-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }

  .turma-item {
    background: var(--s3);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .turma-info { flex: 1; }
  .turma-modulo {
    font-family: 'DM Mono', monospace;
    font-size: .65rem;
    color: var(--accent);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .turma-dias { font-weight: 600; font-size: .9rem; }
  .turma-horario { font-size: .8rem; color: var(--sub); }
  .turma-form { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--dim); margin-top: 4px; word-break: break-all; }

  .turma-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty-turmas {
    text-align: center;
    padding: 20px;
    color: var(--dim);
    font-size: .85rem;
  }

  /* ── MODAL ── */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    display: none;
  }
  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 32px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
  }
  .modal h2 span { color: var(--accent); font-style: italic; }

  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }

  .separator { height: 1px; background: var(--line); }

  @media (max-width: 600px) {
    .switch-card { flex-direction: column; align-items: flex-start; }
    .admin-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="logo">FIEC</div>
    <h1>Painel <span>Admin</span></h1>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginSenha" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <button class="btn btn-accent btn-full" onclick="entrar()">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminPanel">

  <div class="admin-header">
    <div class="admin-header-left">
      <h1>Admin <span>FIEC</span></h1>
      <p>Gerencie inscrições e turmas de todos os polos</p>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="sair()">Sair</button>
  </div>

  <!-- SWITCH -->
  <div class="switch-card">
    <div class="switch-status">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-info">
        <h3 id="statusLabel">Carregando...</h3>
        <p>Status atual em todos os polos</p>
      </div>
    </div>
    <div class="switch-btns">
      <button class="btn btn-green" onclick="setSwitch('ABERTO')">✓ Abrir inscrições</button>
      <button class="btn btn-red"   onclick="setSwitch('FECHADO')">✕ Fechar inscrições</button>
    </div>
  </div>

  <div class="msg" id="switchMsg" style="margin-bottom:24px;"></div>

  <!-- TURMAS -->
  <div class="section-title">Turmas por <span>Polo</span></div>

  <div class="polos-grid" id="polosGrid">
    <!-- gerado por JS -->
  </div>

</div>

<!-- MODAL ADICIONAR/EDITAR TURMA -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitulo">Nova <span>turma</span></h2>

    <div class="field">
      <label>Módulo</label>
      <select id="mModulo">
        <option value="Módulo I — Básico">Módulo I — Básico</option>
        <option value="Módulo II — Intermediário">Módulo II — Intermediário</option>
        <option value="Módulo Intermediário">Módulo Intermediário</option>
        <option value="Básico / Celular">Básico / Celular</option>
        <option value="Intermediário / Celular">Intermediário / Celular</option>
      </select>
    </div>

    <div class="field">
      <label>Dias</label>
      <select id="mDias">
        <option value="2ª e 4ª feira">2ª e 4ª feira</option>
        <option value="3ª e 5ª feira">3ª e 5ª feira</option>
        <option value="Quarta-feira">Quarta-feira</option>
      </select>
    </div>

    <div class="field">
      <label>Horário</label>
      <input type="text" id="mHorario" placeholder="08h30 às 10h00">
    </div>

    <div class="field">
      <label>Link do Google Forms</label>
      <input type="text" id="mForm" placeholder="https://docs.google.com/forms/...">
    </div>

    <div class="separator"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-accent" onclick="salvarTurma()">Salvar turma</button>
    </div>
    <div class="msg" id="modalMsg"></div>
  </div>
</div>

<script>
const API = '/api/switch';

const POLOS = [
  { id: 'polo-fiec',                   nome: 'Polo FIEC' },
  { id: 'polo-ceu',                    nome: 'Polo CEU' },
  { id: 'polo-sol-sol',                nome: 'Polo Sol-Sol' },
  { id: 'polo-comunidade-independente',nome: 'Polo Comunidade Independente' },
  { id: 'polo-casa-da-providencia',    nome: 'Polo Casa da Providência' },
  { id: 'polo-jd-brasil',              nome: 'Polo Jardim Brasil' },
  { id: 'polo-veredas',                nome: 'Polo Veredas' },
  { id: 'polo-bem-viver',              nome: 'Polo Bem Viver' },
];

let senha = '';
let dadosGlobais = {};   // { polo-id: [turmas] }
let editandoPolo = null;
let editandoIdx  = null;

// ── LOGIN ──────────────────────────────────────────────────
function entrar() {
  senha = document.getElementById('loginSenha').value;
  if (!senha) return mostrarMsg('loginMsg', 'Digite a senha', 'err');
  carregarTudo();
}

function sair() {
  senha = '';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginSenha').value = '';
}

// ── CARREGAR ───────────────────────────────────────────────
async function carregarTudo() {
  try {
    const r = await fetch(API);
    const d = await r.json();

    // Verifica se senha bate (faz um POST de teste)
    const teste = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, status: d.aberto ? 'ABERTO' : 'ABERTO' })
    });
    const t = await teste.json();
    if (!t.success && t.error === 'Senha incorreta') {
      return mostrarMsg('loginMsg', 'Senha incorreta', 'err');
    }

    // Login ok
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';

    atualizarStatusDot(d.aberto);
    dadosGlobais = d.turmas || {};
    renderPolos();
  } catch(e) {
    mostrarMsg('loginMsg', 'Erro de conexão', 'err');
  }
}

// ── SWITCH ─────────────────────────────────────────────────
async function setSwitch(status) {
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, status })
    });
    const d = await r.json();
    if (d.success) {
      atualizarStatusDot(status === 'ABERTO');
      mostrarMsg('switchMsg', status === 'ABERTO'
        ? '✓ Inscrições abertas em todos os polos!'
        : '✕ Inscrições fechadas em todos os polos!', 'ok');
    } else {
      mostrarMsg('switchMsg', d.error || 'Erro', 'err');
    }
  } catch(e) {
    mostrarMsg('switchMsg', 'Erro de conexão', 'err');
  }
}

function atualizarStatusDot(aberto) {
  const dot   = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  dot.className   = 'status-dot ' + (aberto ? 'aberto' : 'fechado');
  label.textContent = aberto ? 'Inscrições abertas' : 'Inscrições fechadas';
}

// ── RENDER POLOS ───────────────────────────────────────────
function renderPolos() {
  const grid = document.getElementById('polosGrid');
  grid.innerHTML = POLOS.map(polo => {
    const turmas = dadosGlobais[polo.id] || [];
    const turmasHTML = turmas.length === 0
      ? `<div class="empty-turmas">Nenhuma turma cadastrada</div>`
      : turmas.map((t, i) => `
        <div class="turma-item">
          <div class="turma-info">
            <div class="turma-modulo">${t.modulo}</div>
            <div class="turma-dias">${t.dias}</div>
            <div class="turma-horario">${t.horario}</div>
            ${t.form ? `<div class="turma-form">${t.form.replace('https://docs.google.com/forms/d/','').substring(0,30)}...</div>` : ''}
          </div>
          <div class="turma-actions">
            <button class="btn btn-ghost btn-sm" onclick="editarTurma('${polo.id}', ${i})">✎</button>
            <button class="btn btn-red btn-sm"   onclick="removerTurma('${polo.id}', ${i})">✕</button>
          </div>
        </div>`).join('');

    return `
      <div class="polo-admin-card">
        <div class="polo-admin-header">
          <h4>${polo.nome}</h4>
          <button class="btn btn-accent btn-sm" onclick="novaTurma('${polo.id}')">+ Turma</button>
        </div>
        <div class="polo-admin-body">
          ${turmasHTML}
        </div>
      </div>`;
  }).join('');
}

// ── MODAL ──────────────────────────────────────────────────
function novaTurma(poloId) {
  editandoPolo = poloId;
  editandoIdx  = null;
  document.getElementById('modalTitulo').innerHTML = 'Nova <span>turma</span>';
  document.getElementById('mModulo').value  = 'Módulo I — Básico';
  document.getElementById('mDias').value    = '2ª e 4ª feira';
  document.getElementById('mHorario').value = '';
  document.getElementById('mForm').value    = '';
  document.getElementById('modalMsg').style.display = 'none';
  document.getElementById('modalBg').classList.add('open');
}

function editarTurma(poloId, idx) {
  editandoPolo = poloId;
  editandoIdx  = idx;
  const t = dadosGlobais[poloId][idx];
  document.getElementById('modalTitulo').innerHTML = 'Editar <span>turma</span>';
  document.getElementById('mModulo').value  = t.modulo;
  document.getElementById('mDias').value    = t.dias;
  document.getElementById('mHorario').value = t.horario;
  document.getElementById('mForm').value    = t.form || '';
  document.getElementById('modalMsg').style.display = 'none';
  document.getElementById('modalBg').classList.add('open');
}

function fecharModal() {
  document.getElementById('modalBg').classList.remove('open');
}

async function salvarTurma() {
  const turma = {
    modulo:  document.getElementById('mModulo').value,
    dias:    document.getElementById('mDias').value,
    horario: document.getElementById('mHorario').value.trim(),
    form:    document.getElementById('mForm').value.trim(),
  };

  if (!turma.horario) return mostrarMsg('modalMsg', 'Preencha o horário', 'err');

  const lista = [...(dadosGlobais[editandoPolo] || [])];
  if (editandoIdx !== null) {
    lista[editandoIdx] = turma;
  } else {
    lista.push(turma);
  }

  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, polo: editandoPolo, turmas: lista })
    });
    const d = await r.json();
    if (d.success) {
      dadosGlobais[editandoPolo] = lista;
      renderPolos();
      fecharModal();
    } else {
      mostrarMsg('modalMsg', d.error || 'Erro', 'err');
    }
  } catch(e) {
    mostrarMsg('modalMsg', 'Erro de conexão', 'err');
  }
}

async function removerTurma(poloId, idx) {
  if (!confirm('Remover esta turma?')) return;
  const lista = [...(dadosGlobais[poloId] || [])];
  lista.splice(idx, 1);
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, polo: poloId, turmas: lista })
    });
    const d = await r.json();
    if (d.success) {
      dadosGlobais[poloId] = lista;
      renderPolos();
    }
  } catch(e) { alert('Erro de conexão'); }
}

// ── HELPERS ────────────────────────────────────────────────
function mostrarMsg(id, texto, tipo) {
  const el = document.getElementById(id);
  el.textContent = texto;
  el.className = 'msg ' + tipo;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// Fecha modal ao clicar fora
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === e.currentTarget) fecharModal();
});
</script>
</body>
</html>
